version: '3.4'

services: 

    frontend:
        image: storefrontend
        build:
            context: .
            dockerfile: ./Store/Dockerfile
        environment: 
           - ProductEndpoint=http://backend:8080
        ports:
           - "32000:8080"
        depends_on: 
           - backend
    backend:
        image: productbackend
        build: 
            context: .
            dockerfile: ./Products/Dockerfile
        ports: 
           - "32001:8080"